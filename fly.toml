# Fly.io configuration for Pydantic MCP Server
app = "pydantic-mcp-server"
primary_region = "ord"

[build]

[env]
  MCP_API_KEY = "mcp_S4bRw3Y8M7RqP8ilyRFsOPsNs"
  PORT = "8001"
  HOST = "0.0.0.0"
  PYTHONPATH = "/app/src"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "30s"
      interval = "15s"
      timeout = "10s"
      path = "/health"

[[vm]]
  size = "shared-cpu-1x"